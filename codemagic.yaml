workflows:
  visionclaw-ios:
    name: VisionClaw iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Prepare app secrets
        script: |
          cp samples/CameraAccess/CameraAccess/Secrets.swift.example samples/CameraAccess/CameraAccess/Secrets.swift
      - name: Build unsigned iOS app
        script: |
          set -e
          xcodebuild \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        script: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/CameraAccess.app"
          test -d "$APP_PATH"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/CameraAccess.app
          chmod -R a+rX,u+w build/ipa/Payload/CameraAccess.app
          cd build/ipa
          /usr/bin/zip -qry ../CameraAccess-unsigned.ipa Payload
    artifacts:
      - build/CameraAccess-unsigned.ipa
      - build/Build/Products/Release-iphoneos/*.app
